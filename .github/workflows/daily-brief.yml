name: Daily Morning Brief

on:
  # PAUSED: the daily brief now runs on the PC (Windows Task Scheduler).
  # To resume the cloud schedule, remove the "#" from the two lines below and push.
  # schedule:
  #   - cron: "30 4 * * *"   # 04:30 UTC = 06:30 Israel (winter) / 07:30 (summer)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build today's brief (Claude subagents + TradingView data)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash run_daily.sh

      - name: Save report and data to the repo
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "Morning Brief $(date +%F)" || echo "Nothing to commit"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: logs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
